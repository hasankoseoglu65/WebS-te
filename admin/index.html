<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToysShop Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
body { background:#1a1a2e; color:#fff; min-height:100vh; }

/* Login ekranı */
.login-wrap {
  display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;
}
.login-box {
  background:#25253e; padding:40px; border-radius:15px; width:100%; max-width:380px;
  box-shadow:0 10px 40px rgba(0,0,0,.5);
}
.login-box h1 { text-align:center; margin-bottom:5px; }
.login-box h1 span { color:#ec4899; }
.login-box p { text-align:center; color:#aaa; margin-bottom:25px; font-size:13px; }
.login-box input {
  width:100%; padding:13px; margin-bottom:15px; border:none; border-radius:8px;
  background:#1a1a2e; color:#fff; font-size:14px;
}
.login-box button {
  width:100%; padding:13px; background:#ec4899; color:#fff; border:none;
  border-radius:8px; cursor:pointer; font-weight:bold; font-size:15px;
}
.hata { color:#ef4444; text-align:center; font-size:13px; margin-bottom:10px; display:none; }

/* Panel */
.panel { display:none; padding:25px; max-width:1000px; margin:0 auto; }
.panel-head {
  display:flex; justify-content:space-between; align-items:center; margin-bottom:25px;
  flex-wrap:wrap; gap:10px;
}
.panel-head h1 span { color:#ec4899; }
.cikis { background:#ef4444; color:#fff; border:none; padding:10px 18px; border-radius:8px; cursor:pointer; }

.form-kart, .liste-kart {
  background:#25253e; padding:25px; border-radius:12px; margin-bottom:25px;
}
.form-kart h2, .liste-kart h2 { margin-bottom:18px; font-size:18px; }
.form-satir { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:12px; }
.form-satir input {
  padding:11px; border:none; border-radius:8px; background:#1a1a2e; color:#fff; font-size:14px;
}
.ekle-btn { background:#22c55e; color:#fff; border:none; padding:12px 25px; border-radius:8px; cursor:pointer; font-weight:bold; }

table { width:100%; border-collapse:collapse; }
th, td { padding:12px; text-align:left; border-bottom:1px solid #333; font-size:14px; }
th { color:#aaa; }
.sil-btn { background:#ef4444; color:#fff; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; }

@media (max-width:600px){ .form-satir{ grid-template-columns:1fr; } table{ font-size:12px; } }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>Toys<span>Shop</span></h1>
    <p>Yönetim Paneli Girişi</p>
    <div class="hata" id="hata">Kullanıcı adı veya şifre hatalı!</div>
    <input type="text" id="kadi" placeholder="Kullanıcı Adı">
    <input type="password" id="sifre" placeholder="Şifre">
    <button onclick="girisYap()">Giriş Yap</button>
  </div>
</div>

<!-- PANEL -->
<div class="panel" id="panel">
  <div class="panel-head">
    <h1>Toys<span>Shop</span> Yönetim</h1>
    <button class="cikis" onclick="cikisYap()">Çıkış Yap</button>
  </div>

  <div class="form-kart">
    <h2>➕ Yeni Ürün Ekle</h2>
    <div class="form-satir">
      <input type="text" id="yAd" placeholder="Ürün adı">
      <input type="number" id="yFiyat" placeholder="Fiyat (TL)">
      <input type="text" id="yEmoji" placeholder="Emoji (örn 🎮)">
    </div>
    <div class="form-satir">
      <input type="number" id="yPuan" placeholder="Puan (örn 4.8)" step="0.1">
      <input type="number" id="yYorum" placeholder="Yorum sayısı">
      <input type="text" id="yKategori" placeholder="Kategori">
    </div>
    <button class="ekle-btn" onclick="urunEkle()">Ürünü Ekle</button>
  </div>

  <div class="liste-kart">
    <h2>📦 Mevcut Ürünler</h2>
    <table>
      <thead><tr><th>Ürün</th><th>Fiyat</th><th>Puan</th><th></th></tr></thead>
      <tbody id="urunTablo"></tbody>
    </table>
  </div>
</div>

<script src="../urunler.js"></script>
<script>
// ==== GİRİŞ BİLGİLERİ ====
const ADMIN_KADI = "HasanK";
const ADMIN_SIFRE = "Hasan1245";

// Oturum kontrolü
if (sessionStorage.getItem('toysshop_admin') === 'ok') {
  gosterPanel();
}

function girisYap() {
  const k = document.getElementById('kadi').value;
  const s = document.getElementById('sifre').value;
  if (k === ADMIN_KADI && s === ADMIN_SIFRE) {
    sessionStorage.setItem('toysshop_admin', 'ok');
    gosterPanel();
  } else {
    document.getElementById('hata').style.display = 'block';
  }
}
function cikisYap() {
  sessionStorage.removeItem('toysshop_admin');
  location.reload();
}
function gosterPanel() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('panel').style.display = 'block';
  tabloCiz();
}

function tabloCiz() {
  const liste = urunleriGetir();
  document.getElementById('urunTablo').innerHTML = liste.map(u =>
    `<tr>
      <td>${u.emoji} ${u.ad}</td>
      <td>${u.fiyat.toFixed(2)} TL</td>
      <td>⭐ ${u.puan}</td>
      <td><button class="sil-btn" onclick="urunSil(${u.id})">Sil</button></td>
    </tr>`).join('');
}

function urunEkle() {
  const ad = document.getElementById('yAd').value.trim();
  const fiyat = parseFloat(document.getElementById('yFiyat').value);
  if (!ad || !fiyat) { alert('Ürün adı ve fiyat zorunlu!'); return; }
  const liste = urunleriGetir();
  liste.push({
    id: Date.now(),
    ad: ad,
    fiyat: fiyat,
    emoji: document.getElementById('yEmoji').value || '🎁',
    puan: parseFloat(document.getElementById('yPuan').value) || 5.0,
    yorum: parseInt(document.getElementById('yYorum').value) || 0,
    kategori: document.getElementById('yKategori').value || 'Genel'
  });
  urunleriKaydet(liste);
  tabloCiz();
  document.querySelectorAll('.form-satir input').forEach(i => i.value = '');
  alert('Ürün eklendi! ✅');
}

function urunSil(id) {
  if (!confirm('Bu ürün silinsin mi?')) return;
  urunleriKaydet(urunleriGetir().filter(u => u.id !== id));
  tabloCiz();
}
</script>
</body>
</html>
